<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | Too Cute Books</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">📚 Too Cute Books</a>
    <nav id="nav"></nav>
  </header>

  <main class="container">
    <div id="message" class="flash" hidden></div>

    <form id="staffLoginForm" class="box narrow">
      <h1>Staff login</h1>
      <label>Username <input type="text" id="username" required></label>
      <label>Password <input type="password" id="password" required></label>
      <button>Log in</button>
    </form>
  </main>

  <footer class="foot">CSS325 Database Systems · Team Too Cute to Work</footer>

  <script src="/js/common.js"></script>
  <script src="/js/staff-login.js"></script>
</body>
</html>
