<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books | Too Cute Books</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">📚 Too Cute Books</a>
    <nav id="nav"></nav>
  </header>

  <main class="container">
    <div id="message" class="flash" hidden></div>

    <h1>Books</h1>
    <form id="filterForm" class="filters">
      <input type="text" id="q" placeholder="Search title or author">
      <select id="category"><option value="">All categories</option></select>
      <button>Search</button>
    </form>
    <p id="empty" hidden>No books found.</p>
    <div id="books" class="grid"></div>
  </main>

  <footer class="foot">CSS325 Database Systems · Team Too Cute to Work</footer>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
