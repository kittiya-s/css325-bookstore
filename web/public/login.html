<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Too Cute Books</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">📚 Too Cute Books</a>
    <nav id="nav"></nav>
  </header>

  <main class="container">
    <div id="message" class="flash" hidden></div>

    <form id="loginForm" class="box narrow">
      <h1>Log in</h1>
      <label>Email <input type="email" id="email" required></label>
      <label>Password <input type="password" id="password" required></label>
      <button>Log in</button>
      <p>No account? <a href="/register.html">Register</a></p>
    </form>
  </main>

  <footer class="foot">CSS325 Database Systems · Team Too Cute to Work</footer>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
